[graph]
all-features = true
# v1 ships Windows x64 only (design spec §2). Restricting the graph to that
# triple keeps cargo-deny from resolving non-Windows transitives (e.g.,
# wasip2 / wit-bindgen on WASI, NDK on Android) that aren't compiled here
# but can break `cargo metadata` when they require unreleased toolchain
# features. Add other triples when v1 cross-compiles.
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version       = 2
yanked        = "deny"
ignore        = [
  "RUSTSEC-2025-0056", # adler unmaintained, but needed by miniz_oxide
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "LicenseRef-Proprietary",
]
confidence-threshold = 0.93
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
