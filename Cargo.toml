[workspace]
resolver = "2"
members  = ["crates/*"]

[workspace.package]
edition      = "2021"
rust-version = "1.83"
version      = "0.1.0"
authors      = ["Chris Van Doren <chris@thevandorens.com>"]
license      = "LicenseRef-Proprietary"
repository   = "https://github.com/sl4ppy/TerraFICS"

[workspace.dependencies]
thiserror   = "1.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
miniz_oxide = { version = "0.7", features = ["std"] }
toml        = "0.5"
rusqlite    = { version = "=0.31.0", features = ["bundled"] }
zstd        = "0.13"
blake3      = "=1.5.5"
rayon       = "1.10"
criterion   = { version = "0.5", default-features = false }
# P1.5-b: GPU + windowing deps. Only scim-render uses them today; promoted
# to the workspace table for consistency with project convention.
wgpu        = "22"
winit       = "0.30"
bytemuck    = { version = "1.16", features = ["derive"] }
glam        = { version = "0.27", features = ["bytemuck"] }
pollster    = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all                  = { level = "warn", priority = -1 }
pedantic             = { level = "warn", priority = -1 }
nursery              = { level = "warn", priority = -1 }
# Quieten a few pedantic lints that fight idiomatic Rust:
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[profile.release]
lto              = "thin"
codegen-units    = 1
strip            = "symbols"

[profile.bench]
inherits = "release"
debug    = true
